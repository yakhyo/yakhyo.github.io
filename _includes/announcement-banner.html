{% if site.announcement.enabled %}
{%- assign banner_version = site.announcement.text | append: site.announcement.link | slugify -%}
<script>
  (function(){try{
    if(localStorage.getItem('announcement_dismissed_{{ banner_version }}')==='true'){
      document.write('<style>#announcement-banner{display:none}</style>');
    }
  }catch(_){}})();
</script>
<div id="announcement-banner" class="announcement-banner"
     data-version="{{ banner_version }}">
  <div class="announcement-content">
    <span class="announcement-text">
      {{ site.announcement.text }}
      {% if site.announcement.link %}
        <a href="{{ site.announcement.link }}">{{ site.announcement.link_text }}</a>
      {% endif %}
      {{ site.announcement.post_text }}
    </span>
    <button class="announcement-close" aria-label="Close announcement">✕</button>
  </div>
</div>
<script src="{{ "/assets/js/announcement.js" | relative_url }}" defer></script>
{% endif %}
