# `jekyll serve` does not reload this file; restart it after editing.

title: Yakhyokhuja Valikhujaev
email: yakhyo9696@gmail.com
description: >-
  Exploring Life Through the Lens of a Computer Scientist.

baseurl: ""
url: "https://yakhyo.github.io"

# `twitter` gives non-post pages a valid twitter:creator (posts use _data/authors.yml).
author:
  name: Yakhyokhuja Valikhujaev
  twitter: y_valikhujaev

# Single source for profile links: footer, landing, about, resume, and the JSON-LD sameAs list.
profiles:
  github:        https://github.com/yakhyo
  scholar:       https://scholar.google.com/citations?user=I66QbJIAAAAJ
  stackoverflow: https://stackoverflow.com/users/14815986/yakhyo
  leetcode:      https://leetcode.com/y_valikhujaev
  youtube:       https://youtube.com/codeuz
  telegram:      https://t.me/valikhujaev
  twitter:       https://twitter.com/y_valikhujaev

# jekyll-seo-tag reads this for twitter:site and the card type.
twitter:
  username: y_valikhujaev
  card: summary_large_image

lang: en
locale: en_US
timezone: Asia/Seoul

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - _pages/blog.md
  - _pages/projects.md
  - _pages/about.md

include:
  - _pages

giscus:
  repo: "yakhyo/yakhyo.github.io"
  repo_id: "R_kgDOMNAolA"
  category: "General"
  category_id: "DIC_kwDOMNAolM4C8ulE"
  mapping: "pathname"
  theme: "light"
  lang: "en"

google_analytics: G-G2VCRRX3LR

show_excerpts: true

# Update here when uploading a new resume PDF to /assets/resumes/.
resume:
  pdf: yakhyo_20251110.pdf

# Typewriter titles on the landing page; the first is also the JSON-LD jobTitle.
landing_titles:
  - "AI/ML Software Engineer"
  - "ML Research Engineer"

# Fallback OG/Twitter image for posts that don't define their own `image:`.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image:
        path: /assets/images/landing-page-preview.png
        width: 1200
        height: 630
        alt: Yakhyokhuja Valikhujaev personal website landing page
      author: Yakhyokhuja Valikhujaev

permalink: /blog/:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

sass:
  style: compressed
  quiet_deps: true
  verbose: false
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
