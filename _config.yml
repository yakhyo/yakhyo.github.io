# Site Configuration — restart the server after editing this file.

title: Yakhyokhuja Valikhujaev
email: yakhyo9696@gmail.com
description: >-
  Exploring Life Through the Lens of a Computer Scientist.

baseurl: ""
url: "https://yakhyo.github.io"

author:
  name: Yakhyokhuja Valikhujaev

# Single source of truth for every social / professional link — update a URL
# here once and it flows into the footer, landing page, about, and resume.
profiles:
  github:        https://github.com/yakhyo
  linkedin:      https://linkedin.com/in/y-valikhujaev
  scholar:       https://scholar.google.com/citations?user=I66QbJIAAAAJ
  stackoverflow: https://stackoverflow.com/users/14815986/yakhyo
  leetcode:      https://leetcode.com/y_valikhujaev
  youtube:       https://youtube.com/codeuz
  telegram:      https://t.me/valikhujaev
  twitter:       https://twitter.com/y_valikhujaev

# jekyll-seo-tag consumes this exact shape — keep it separate from `profiles`;
# the plugin expects `social.name` and `social.links`.
social:
  name: Yakhyokhuja Valikhujaev
  links:
    - https://github.com/yakhyo
    - https://linkedin.com/in/y-valikhujaev
    - https://scholar.google.com/citations?user=I66QbJIAAAAJ
    - https://twitter.com/y_valikhujaev

lang: en
timezone: Asia/Seoul

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - _pages/blog.md
  - _pages/about.md

include:
  - _pages

giscus:
  repo: "yakhyo/yakhyo.github.io"
  repo_id: "R_kgDOMNAolA"
  category: "General"
  category_id: "DIC_kwDOMNAolM4C8ulE"
  mapping: "pathname"
  theme: "light"
  lang: "en"

google_analytics: G-G2VCRRX3LR

show_excerpts: true

# Update here when uploading a new resume PDF to /assets/resumes/.
resume:
  pdf: yakhyo_20251110.pdf

# Typewriter titles cycled on the landing page.
landing_titles:
  - "ML Software Engineer"
  - "MLOps Engineer"

# Fallback OG/Twitter image for posts that don't define their own `image:`.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image:
        path: /assets/images/landing-page-preview.png
        width: 1200
        height: 630
        alt: Yakhyokhuja Valikhujaev personal website landing page
      author: Yakhyokhuja Valikhujaev

permalink: /blog/:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

sass:
  style: compressed
  quiet_deps: true
  verbose: false
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

announcement:
  enabled: true
  text: "Support our work — give"
  link: "https://github.com/yakhyo/uniface"
  link_text: "UniFace"
  post_text: "a ⭐ on GitHub and help us reach more developers!"
