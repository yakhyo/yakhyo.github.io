<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

{%- include head.html -%}

<body{% if page.url == '/' %} class="landing-page-body"{% endif %}>

  {%- include announcement-banner.html -%}
  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}

  <noscript><style>body.landing-page-body footer{display:block}</style></noscript>
  <script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>

</body>

</html>
